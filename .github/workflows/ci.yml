# CI — the green gate, public. Runs the same `npm run verify` a developer runs locally, on
# every push + PR. A contributor's PR proves green before merge.
#
# `verify` is the whole deterministic suite, not the root config alone: unit + failure_modes +
# honest_broker + security (collected, spend-gated on COLTRANE_LIVE) + the offline half of the
# e2e band. That equivalence is the point. test.yml and coverage.yml used to call
# `npx vitest run` directly, which is root-config-only, so CI ran a strictly smaller set than
# `npm run verify` and "green" meant different things in different places (#262). Every
# workflow now goes through a package.json script.
#
# The live-Claude half — `npm run e2e`, and this same security band under COLTRANE_LIVE=1 —
# needs the CLI + ANTHROPIC_API_KEY and is not run here by design. See CI.md.
#
# No test count is asserted in this comment on purpose: the previous one claimed "481 tests"
# against a suite of 1576 and had been wrong long enough that nobody noticed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run verify

  # THE ROOM ACTUALLY STANDS UP. Separate from `verify` because it needs an image that is BUILT, not
  # installed: `coltrane/room:ephemeral` is published nowhere, so every other job's host sends the
  # compose pull to a registry and is denied. The live laws gate on the image's presence and SKIP
  # without it — which is honest, but a law that can never run in CI is barely a law, so this job
  # builds it and runs them for real.
  room:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: build the room image
        run: docker build -f Dockerfile.room -t coltrane/room:ephemeral .
      - name: the emitted transport reaches a standing room
        run: npx vitest run tests/spec_venue_room_live.test.ts
      - name: nothing survives the run
        run: |
          left=$(docker ps -aq --filter 'label=coltrane.managed=true' | wc -l)
          echo "coltrane containers left behind: $left"
          test "$left" -eq 0
