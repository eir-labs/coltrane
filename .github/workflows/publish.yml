name: publish

on:
  push:
    branches: [main]

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # tag push at the end
      id-token: write         # OIDC trusted publishing (provenance attached automatically)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
      - run: npm ci
      # Verify runs on the node-shipped npm (10.x) — the version the pack-audit tests target.
      # `npm pack --dry-run` changed its manifest output under npm 11, so upgrading BEFORE verify
      # (as the first draft did) broke tests/pack_content_audit for a CI-only reason.
      - run: npm run verify
      # Only a merge that bumped package.json version publishes; every other merge no-ops here.
      - id: check
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "@eir-labs/coltrane@$V" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$V already on npm — skipping"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "version=$V" >> "$GITHUB_OUTPUT"
          fi
      # Trusted publishing needs npm >= 11.5.1; upgrade only now, past verify.
      - if: steps.check.outputs.publish == 'true'
        run: npm install -g npm@latest
      - if: steps.check.outputs.publish == 'true'
        run: npm publish
      - if: steps.check.outputs.publish == 'true'
        run: |
          git tag "v${{ steps.check.outputs.version }}"
          git push origin "v${{ steps.check.outputs.version }}"
