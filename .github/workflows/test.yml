# Cross-environment test matrix. Sweeps typecheck + every deterministic band across
# {ubuntu, macos} x {node 20, node 22}.
#
# Failure on a single matrix cell isolates the regression to (OS, node-version);
# see CI.md "Interpreting failures" for triage notes.
#
# #262 — what this workflow used to run, and why it changed:
#
#   * `unit` called `npx vitest run`, which is ROOT-CONFIG ONLY. failure_modes, honest_broker,
#     security and e2e were all invisible to it, so this workflow and `npm run verify`
#     disagreed about what "the suite" is. Every job now calls a package.json script, so the
#     thing CI runs is the thing a developer can run.
#   * `e2e-smoke` was a documented stub that echoed a warning and exited 0 — and it was gated
#     to push-to-main, so on a PR it did not even do that. The entire e2e band, 36 files,
#     executed nowhere in automation. It is replaced by `e2e-offline`, which runs the real
#     specs that need no model (tests/e2e/vitest.offline.config.ts). The live half still needs
#     a scripted CLI install + ANTHROPIC_API_KEY and is still out — but it is now the only
#     part that is, and it is one exclude list a reviewer can read.

name: test

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs for the same ref. Saves CI minutes on rapid push.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: typecheck (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["20.x", "22.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
      - run: npm ci
      - run: npx tsc --noEmit

  unit:
    name: unit (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["20.x", "22.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
      - run: npm ci
      # The fast unit band (root vitest.config.ts). The other bands are separate jobs below —
      # `npx vitest run` reaches none of them, which is how four configs went unexecuted.
      - run: npm test

  bands:
    name: failure-modes + honest-broker + security (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["20.x", "22.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
      - run: npm ci
      - run: npm run test:failure-modes
      - run: npm run test:honest-broker
      # COLTRANE_LIVE is deliberately NOT set: the prompt-injection scenarios collect and
      # report as skipped, so the band is executed and visible on every PR at zero cost.
      # Setting COLTRANE_LIVE=1 here would spawn the real CLI and bill on every run.
      - run: npm run test:security

  e2e-offline:
    name: e2e (offline half, ubuntu, node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
      - run: npm ci
      # Runs the e2e specs that need no model. The script builds first: this band drives
      # dist/ (relay_restart_handshake.spec.ts spawns dist/src/server_entry.js), and a stale
      # dist means testing bytes that are not this branch's.
      #
      # The live half (`npm run e2e`) still needs a scripted claude CLI install +
      # ANTHROPIC_API_KEY and is not wired here — see CI.md "e2e gate" and the exclude list
      # in tests/e2e/vitest.offline.config.ts. That exemption is asserted in writing by
      # tests/test_band_wiring.test.ts so it cannot quietly become the norm again.
      - run: npm run e2e:offline
