# Cross-environment test matrix. Sweeps typecheck + unit suite across
# {ubuntu, macos} x {node 20, node 22}. e2e smoke is push-to-main only and
# requires the claude CLI, which is currently documented-but-skipped (see CI.md).
#
# Failure on a single matrix cell isolates the regression to (OS, node-version);
# see CI.md "Interpreting failures" for triage notes.

name: test

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs for the same ref. Saves CI minutes on rapid push.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: typecheck (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["20.x", "22.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
      - run: npm ci
      - run: npx tsc --noEmit

  unit:
    name: unit (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["20.x", "22.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
      - run: npm ci
      # Root vitest.config.ts already excludes tests/e2e/**, so this is the
      # deterministic unit suite only — no claude CLI needed.
      - run: npx vitest run

  e2e-smoke:
    name: e2e smoke (eng_manager, ubuntu, node 22)
    # Only run on push to main — e2e is slow + needs the claude CLI.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
      - run: npm ci
      # claude CLI install path is not yet trivially scriptable in CI.
      # The CLI ships via Anthropic's installer + auths against ANTHROPIC_API_KEY;
      # the auth + install handshake is not yet wired here. See CI.md "e2e gate".
      # When ready, replace this skip with the install + the targeted spec run:
      #   npx vitest run --config tests/e2e/vitest.config.ts tests/e2e/sub_thread.eng_manager.spec.ts
      - name: skip (claude CLI install not yet scripted)
        run: |
          echo "::warning::e2e-smoke job is documented-but-skipped. See CI.md."
          echo "Required to enable: scripted claude CLI install + ANTHROPIC_API_KEY secret."
